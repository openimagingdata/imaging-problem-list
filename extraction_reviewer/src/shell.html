<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Extraction Review</title>
    <style>
      __STYLES__
    </style>
  </head>
  <body>
    __LANDING_HTML__ __APP_SHELL_HTML__

    <dialog id="reviewerDialog" class="reviewer-dialog" aria-labelledby="reviewerDialogTitle">
      <form id="reviewerForm" class="reviewer-dialog-frame">
        <div class="reviewer-dialog-topbar">
          <strong id="reviewerDialogTitle">Who&rsquo;s reviewing?</strong>
          <button type="button" id="reviewerCancelBtn" class="dialog-close" aria-label="Close">&times;</button>
        </div>
        <div class="reviewer-dialog-body">
          <p>Enter the name that should appear in the review export.</p>
          <label for="reviewerNameInput">Reviewer name</label>
          <input id="reviewerNameInput" type="text" autocomplete="name" placeholder="e.g. Jane Doe" />
          <div class="reviewer-dialog-actions">
            <button type="submit" class="primary">Save reviewer</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="helpDialog" class="help-dialog">
      <div class="help-dialog-frame">
        <div class="help-dialog-topbar">
          <strong>Reviewer guide</strong>
          <button type="button" id="helpCloseBtn" class="help-dialog-close" aria-label="Close">&times;</button>
        </div>
        <div class="help-dialog-body">__REVIEWER_GUIDE__</div>
      </div>
    </dialog>

    <script>
      __VENDOR_ZIP_JS__;
    </script>
    <script>
      window.APP_VERSION = '__APP_VERSION__';
      window.EMBEDDED_BUNDLE_B64 = '__EMBEDDED_BUNDLE_B64__';
      __APP_JS__;
    </script>
  </body>
</html>
